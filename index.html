<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的学习小软件 · 四年级</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; height:100dvh; background:#0e1320; color:#eaf0fb;
              font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
              overflow:hidden; overscroll-behavior:none; touch-action:none; position:fixed; width:100%; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; height:100%; height:100dvh; overflow:hidden; }
  /* 顶栏 */
  #top { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px;
         background:linear-gradient(135deg,#2a3c66,#3b2f66); color:#fff; box-shadow:0 2px 12px rgba(0,0,0,.4); }
  #top .logo { font-size:20px; }
  #top h1 { font-size:16px; font-weight:800; letter-spacing:.5px; }
  #top .sub { font-size:11px; opacity:.8; font-weight:400; }
  #back { margin-left:auto; font-size:13px; padding:6px 12px; border:none; border-radius:20px;
          background:rgba(255,255,255,.18); color:#fff; cursor:pointer; display:none; }
  #back:active { transform:scale(.96); }
  /* 内容区 */
  #content { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; touch-action:auto; }
  #content::-webkit-scrollbar { width:0; }
  .section { margin-bottom:18px; }
  .sec-title { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; margin:4px 2px 10px; }
  .sec-title .dot { width:10px; height:10px; border-radius:50%; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .tile { position:relative; border-radius:16px; padding:14px 12px; cursor:pointer; overflow:hidden;
          background:#19223a; border:1px solid #2a3450; transition:transform .12s, box-shadow .12s; }
  .tile:active { transform:translateY(2px); }
  .tile .emo { font-size:26px; }
  .tile .t { font-size:14px; font-weight:700; margin-top:6px; }
  .tile .d { font-size:10px; color:#9fb0cc; margin-top:2px; line-height:1.4; }
  /* 英语单词卡：字大一点、卡片大一点点 */
  .tile.vcard { padding:18px 14px; }
  .tile.vcard .emo { font-size:30px; }
  .tile.vcard .t { font-size:21px; font-weight:800; }
  .tile.vcard .d { font-size:12px; margin-top:6px; }
  .tile .badge { position:absolute; right:10px; top:10px; font-size:18px; opacity:.5; }
  /* 通用卡片/按钮 */
  .card { background:#19223a; border:1px solid #2a3450; border-radius:14px; padding:14px; margin-bottom:12px; }
  .pill { display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; background:#26314f; color:#bcd0f0; margin-right:6px; }
  .btn { font-size:13px; padding:9px 16px; border:none; border-radius:10px; cursor:pointer; font-weight:700;
         background:linear-gradient(180deg,#ffd86b,#f0a93c); color:#2a1c00; }
  .btn:active { transform:translateY(1px); }
  .btn.ghost { background:#222c47; color:#cdd8ec; }
  .btn.sm { padding:6px 12px; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:#9fb0cc; font-size:12px; }
  textarea { width:100%; min-height:120px; background:#0f1626; color:#eaf0fb; border:1px solid #2a3450;
             border-radius:10px; padding:10px; font-size:14px; line-height:1.6; font-family:inherit; resize:vertical; }
  input[type=text], input[type=number] { background:#0f1626; color:#eaf0fb; border:1px solid #2a3450;
             border-radius:10px; padding:9px 12px; font-size:15px; font-family:inherit; }
  .opt { display:block; width:100%; text-align:left; margin:7px 0; padding:10px 12px; border-radius:10px;
         background:#0f1626; border:1px solid #2a3450; color:#eaf0fb; font-size:14px; cursor:pointer; }
  .opt:active { transform:scale(.99); }
  .opt.ok { background:#163a25; border-color:#2fae5e; color:#9dffb8; }
  .opt.no { background:#3a1620; border-color:#e0566e; color:#ffb3c0; }
  .feedback { font-size:13px; font-weight:700; margin-top:8px; }
  .flip { perspective:800px; }
  .flip .inner { transition:transform .5s; transform-style:preserve-3d; }
  .flip.done .inner { transform:rotateY(180deg); }
  .face { backface-visibility:hidden; }
  .face.back { transform:rotateY(180deg); }
  .pinyin { color:#7fd3ff; font-size:13px; letter-spacing:1px; }
  .poemline { font-size:19px; line-height:1.9; font-weight:600; }
  .score { font-size:13px; color:#ffd86b; font-weight:700; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f2a45; color:#fff;
           padding:9px 16px; border-radius:20px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.5); opacity:0; transition:opacity .25s; z-index:50; }
  .toast.show { opacity:1; }
  .hl { color:#ffd86b; }
</style>
</head>

const $ = s => document.querySelector(s);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400); }
function speak(text, lang){ try{ if(!('speechSynthesis' in window)){ toast('当前环境不支持朗读'); return; } const u=new SpeechSynthesisUtterance(text); u.lang=lang||'zh-CN'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ===================== 仪表盘 ===================== */
function tile(mod, emo, t, d, badge){ return '<div class="tile" data-mod="'+mod+'"><span class="badge">'+badge+'</span><div class="emo">'+emo+'</div><div class="t">'+t+'</div><div class="d">'+d+'</div></div>'; }
function section(color, title, tiles){
  let h='<div class="section"><div class="sec-title"><span class="dot" style="background:'+color+'"></span>'+title+'</div><div class="grid">';
  tiles.forEach(t=> h+=tile(t[0],t[1],t[2],t[3],t[4]||''));
  return h+'</div></div>';
}
function home(){
  current='home'; backBtn.style.display='none';
  content.innerHTML =
    section('#3b82f6','语文 · 人教版 🩵',[
      ['poem','📜','古诗乐园','四上9首古诗+拼音+测验'],
      ['essay','✍️','作文小帮手','单元习作题目+结构+随时写'],
      ['read','📚','阅读理解','神话/寓言/说明文+选择题']]) +
    section('#22c55e','数学 · 北师大版 💚',[
      ['math','➕','口算天天练','随机出题+即时判分'],
      ['mword','🧩','应用题','四上典型题+步骤讲解'],
      ['review','⭐','复习重点','四上知识点翻卡']]) +
    section('#a855f7','英语 · 沪教版 💜',[
      ['vocab','🃏','单词卡片','四上单词+发音'],
      ['eessay','📝','英语小作文','四上话题+范文'],
      ['speak','🗣️','跟读练习','四上重点句跟读']]);
  content.querySelectorAll('.tile').forEach(el=> el.onclick=()=> go(el.dataset.mod));

/* ===================== 导航壳 ===================== */
function shell(title, html){

  content.innerHTML = '<div style="font-size:14px;font-weight:800;color:#ffd86b;margin:2px 0 12px">'+title+'</div>'+html;

/* ===================== 语文：古诗 ===================== */
function goPoem(){ shell('古诗乐园', '<div id="poemWrap"></div>'); renderPoemList(); }
function renderPoemList(){
  let h='<div class="muted" style="margin-bottom:10px">点一首古诗，看拼音、译文，还能“考考你”。</div><div class="grid">';
  POEMS.forEach((p,i)=> h+='<div class="tile" data-i="'+i+'"><div class="emo">📜</div><div class="t">'+p.title+'</div><div class="d">'+p.dynasty+'·'+p.author+'</div></div>');
  h+='</div>';
  $('#poemWrap').innerHTML=h;
  $('#poemWrap').querySelectorAll('.tile').forEach(el=> el.onclick=()=> renderPoem(+el.dataset.i));
}
function renderPoem(i){
  const p=POEMS[i];
  let lines='';
  for(let k=0;k<p.lines.length;k++) lines+='<div class="pinyin">'+p.pin[k]+'</div><div class="poemline">'+p.lines[k]+'</div>';
  const authors=shuffle(POEMS.map(x=>x.author).filter((v,idx,a)=>a.indexOf(v)===idx));
  const opts=shuffle([p.author].concat(authors.filter(a=>a!==p.author).slice(0,2)));
  let q='<div class="card"><div style="font-weight:700;margin-bottom:8px">考考你：《'+p.title+'》的作者是谁？</div>';
  opts.forEach(o=> q+='<button class="opt" data-a="'+o+'">'+o+'</button>');
  q+='<div class="feedback" id="pq"></div></div>';
  $('#poemWrap').innerHTML='<div class="card"><div style="font-size:17px;font-weight:800">'+p.title+'</div>'+
    '<div class="muted" style="margin:2px 0 10px">'+p.dynasty+' · '+p.author+'</div>'+lines+
    '<div class="muted" style="margin-top:10px;line-height:1.7">'+p.mean+'</div>'+
    '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="pback">← 返回列表</button><button class="btn sm" id="pread">🔊 朗读</button></div></div>'+q;
  $('#pback').onclick=renderPoemList;
  $('#pread').onclick=()=> speak(p.lines.join(' '),'zh-CN');
  $('#poemWrap').querySelectorAll('.opt').forEach(b=> b.onclick=()=>{
    const right=(b.dataset.a===p.author);
    $('#poemWrap').querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.a===p.author) x.classList.add('ok'); });
    if(!right) b.classList.add('no');
    $('#pq').textContent= right?'✅ 答对啦！就是'+p.author+'。' : '❌ 不对哦，正确答案是 '+p.author+'。';
    $('#pq').style.color= right?'#9dffb8':'#ffb3c0';
  });
}

/* ===================== 语文：作文 ===================== */
function goEssay(){ shell('作文小帮手', '<div id="ew"></div>'); renderEssayList(); }
function renderEssayList(){
  let h='<div class="muted" style="margin-bottom:10px">选一个题目，看写作小提示和范文，还能直接在下面写，自动帮你保存。</div><div class="grid">';
  ESSAY_TOPICS.forEach((e,i)=> h+='<div class="tile" data-i="'+i+'"><div class="emo">✍️</div><div class="t">'+e.t+'</div><div class="d">点开写一写</div></div>');
  h+='</div>';

}
function renderEssay(i){
  const e=ESSAY_TOPICS[i];
  const saved=localStorage.getItem('essay_'+i)||'';
  let tips=''; e.tip.forEach(t=> tips+='<span class="pill">'+t+'</span>');

    '<textarea id="eta" placeholder="在这里写你的作文，写完点保存……">'+esc(saved)+'</textarea>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="esave">💾 保存</button><button class="btn ghost sm" id="eclear">清空</button><button class="btn ghost sm" id="eback">← 返回</button><span class="muted" id="ecount"></span></div></div>';

  $('#esave').onclick=()=>{ localStorage.setItem('essay_'+i, ta.value); toast('已保存到本机 ✅'); };

/* ===================== 语文：阅读理解 ===================== */
function goRead(){ shell('阅读理解', '<div id="rw"></div>'); renderReadList(); }
function renderReadList(){
  let h='<div class="muted" style="margin-bottom:10px">读短文，做选择题，做完看对错。</div><div class="grid">';
  READINGS.forEach((r,i)=> h+='<div class="tile" data-i="'+i+'"><div class="emo">📚</div><div class="t">'+r.title+'</div><div class="d">'+(r.qs.length)+' 道小题</div></div>');
  h+='</div>';
  $('#rw').innerHTML=h;
  $('#rw').querySelectorAll('.tile').forEach(el=> el.onclick=()=> renderRead(+el.dataset.i));
}
function renderRead(i){
  const r=READINGS[i];
  let h='<div class="card"><div style="font-weight:800;margin-bottom:6px">'+r.title+'</div><div class="muted" style="line-height:1.8">'+r.text+'</div></div>';
  r.qs.forEach((q,qi)=>{
    h+='<div class="card"><div style="font-weight:700;margin-bottom:6px">'+(qi+1)+'. '+q.q+'</div>';
    q.o.forEach((o,oi)=> h+='<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>');
    h+='<div class="feedback" id="rf'+qi+'"></div></div>';
  });
  h+='<button class="btn ghost sm" id="rback" style="margin-bottom:20px">← 返回</button>';
  $('#rw').innerHTML=h;
  $('#rback').onclick=renderReadList;
  $('#rw').querySelectorAll('.opt').forEach(b=> b.onclick=()=>{
    const qi=+b.dataset.q, oi=+b.dataset.o, right=(oi===r.qs[qi].a);
    const group=$('#rw').querySelectorAll('.opt[data-q="'+qi+'"]');
    group.forEach(x=>{ x.disabled=true; if(+x.dataset.o===r.qs[qi].a) x.classList.add('ok'); });
    if(!right) b.classList.add('no');
    const fb=$('#rf'+qi); fb.textContent= right?'✅ 答对了！' : '❌ 正确答案：'+r.qs[qi].o[r.qs[qi].a];
    fb.style.color= right?'#9dffb8':'#ffb3c0';
  });
}

/* ===================== 数学：口算 ===================== */
let mathState={list:[],idx:0,right:0};
function genMath(){
  const types=['add','sub','mul','div'], t=types[Math.floor(Math.random()*4)];
  let a,b,ans,s;
  if(t==='add'){ a=Math.floor(Math.random()*90)+10; b=Math.floor(Math.random()*90)+10; ans=a+b; s=a+' + '+b+' = ?'; }
  else if(t==='sub'){ a=Math.floor(Math.random()*90)+20; b=Math.floor(Math.random()*a)+1; ans=a-b; s=a+' − '+b+' = ?'; }
  else if(t==='mul'){ a=Math.floor(Math.random()*9)+2; b=Math.floor(Math.random()*9)+2; ans=a*b; s=a+' × '+b+' = ?'; }
  else { b=Math.floor(Math.random()*9)+2; ans=Math.floor(Math.random()*9)+2; a=b*ans; s=a+' ÷ '+b+' = ?'; }
  return {s, ans};
}
function goMath(){ shell('口算天天练', '<div id="mw"></div>'); mathState={list:[],idx:0,right:0}; for(let i=0;i<10;i++) mathState.list.push(genMath()); renderMath(); }
function renderMath(){
  const q=mathState.list[mathState.idx];
  $('#mw').innerHTML='<div class="card"><div class="score">第 '+(mathState.idx+1)+' / 10 题　答对：'+mathState.right+'</div>'+
    '<div style="font-size:30px;font-weight:800;text-align:center;margin:14px 0">'+q.s+'</div>'+
    '<input type="number" id="mins" inputmode="numeric" placeholder="写答案" style="width:100%;text-align:center;font-size:20px">'+
    '<div class="row" style="margin-top:10px;justify-content:center"><button class="btn" id="mchk">检查</button><span class="feedback" id="mf"></span></div>'+
    '<div class="row" style="margin-top:10px;justify-content:center"><button class="btn ghost sm" id="mskip">跳过</button></div></div>';
  const inp=$('#mins'); inp.focus();
  $('#mchk').onclick=()=>{ const v=inp.value.trim(); if(v===''){ toast('先写答案哦'); return; }
    const ok=(+v===q.ans); const fb=$('#mf');
    if(ok){ mathState.right++; fb.textContent='✅ 对了！'; fb.style.color='#9dffb8'; } else { fb.textContent='❌ 答案是 '+q.ans; fb.style.color='#ffb3c0'; }
    setTimeout(nextMath, 700); };
  $('#mskip').onclick=nextMath;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') $('#mchk').click(); });
  function nextMath(){ mathState.idx++; if(mathState.idx>=10){ renderMathEnd(); } else renderMath(); }
}
function renderMathEnd(){
  const r=mathState.right;
  let msg= r===10?'🏆 全对！太厉害了！' : r>=7?'🌟 很棒，再练练更稳！' : r>=5?'💪 及格啦，继续加油！' : '📖 多练口算，你会越来越快！';
  $('#mw').innerHTML='<div class="card" style="text-align:center"><div style="font-size:30px">'+msg+'</div>'+
    '<div class="score" style="font-size:18px;margin:10px 0">共 10 题，答对 '+r+' 题</div>'+
    '<button class="btn" id="magain">🔄 再来一组</button></div>';
  $('#magain').onclick=goMath;
}

/* ===================== 数学：应用题 ===================== */

backBtn.onclick=home;

home();
